- aid: ai21-labs:batch
  name: AI21 Batch API
  description: >-
    Asynchronous batch processing for large volumes of Jamba completions. Submit a batch job, poll for
    status, and download results when the run completes.
  humanURL: https://docs.ai21.com/reference
  baseURL: https://api.ai21.com/studio/v1
  tags:
  - Batch
  - Async
  - Inference
  properties:
  - type: Documentation
    url: https://docs.ai21.com/reference
- aid: ai21-labs:fine-tuning
  name: AI21 Fine-Tuning API
  description: >-
    Fine-tuning service for Jamba models supporting full, LoRA, and QLoRA strategies. Create training
    jobs from uploaded datasets and deploy the resulting model variants behind the standard chat completions
    endpoint.
  humanURL: https://docs.ai21.com/docs/fine-tuning
